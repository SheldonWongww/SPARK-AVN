[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "navtta-core"
version = "0.1.0"
description = "Task-agnostic test-time adaptation utilities for embodied navigation"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["."]
include = ["navtta_core*"]
