experiment_id: tent_core_grid_v1
status: planned
purpose: >-
  Characterize the stability and effective adaptation budget of continual Tent
  before fixing Tent hyperparameters for the remaining AVN comparisons.

task: avn
benchmark: mp3d
model: smt_audio
source_setting: single_source
method: tent

search_space:
  TTA.LR: [1.0e-8, 3.0e-8, 1.0e-7, 3.0e-7, 1.0e-6]
  TTA.UPDATE_INTERVAL: [1, 2, 3, 4, 8, 16]
  TTA.NORM_SCOPE: [first_ln, last_ln, last_k_ln, ln]

fixed:
  TTA.EPISODIC: false
  TTA.STEPS: 1
  TTA.LAST_K_LN: 4
  TTA.OPTIMIZER: Adam
  TTA.BETA1: 0.9
  TTA.BETA2: 0.999
  TTA.WEIGHT_DECAY: 0.0
  TTA.MAX_GRAD_NORM: 1.0
  TEST_EPISODE_COUNT: 2000
  seed: 0

job_count: 120
launcher: avn/scripts/run_tent_core_grid.sh

reported_metrics:
  - success
  - spl
  - softspl
  - sna
  - na
  - distance_to_goal
  - normalized_distance_to_goal

stability_diagnostics:
  - window_success
  - window_spl
  - final_500_episode_success
  - action_steps
  - updates
  - mean_entropy
  - mean_max_action_probability
  - action_counts
  - relative_param_drift
  - last_grad_norm

selection_protocol:
  primary_metric: spl
  secondary_metric: success
  reject_on_numerical_failure: true
  require_no_late_stream_collapse: true
  confirmation_seeds: [0, 1, 2]
  note: >-
    Use seed 0 for screening. Re-run the selected configurations and the Source
    control with all confirmation seeds. Treat seed as an episode-order
    replication, not as a searched hyperparameter.

data_protocol:
  role: development
  warning: >-
    The stream used to select a configuration must not also serve as the
    untouched final comparison stream. Keep the final stream disjoint by scene
    or episode identity and lock all hyperparameters before final evaluation.

known_boundary:
  excluded_lr: 1.0e-5
  reason: >-
    Previous UPDATE_INTERVAL=1 runs collapsed to near-zero success within the
    first 200 episodes. Retain those runs as a negative boundary in the
    appendix instead of recomputing them in this grid.
