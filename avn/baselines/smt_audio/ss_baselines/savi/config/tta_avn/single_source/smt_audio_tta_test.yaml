BASE_TASK_CONFIG_PATH: "configs/tta_avn/single_source/mp3d/semantic_audiogoal_smt_audio_test.yaml"
TRAINER_NAME: "ddppo"
# FSTTA/FEEDTTA/ATENA are episode-ordered methods. Keep TTA sequential.
NUM_PROCESSES: 1
SENSORS: ["DEPTH_SENSOR", "RGB_SENSOR"]
NUM_UPDATES: 30000
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 100
VIDEO_OPTION: []
VISUALIZATION_OPTION: []
TEST_EPISODE_COUNT: 2000

EVAL:
  # The TTA val split is the fixed 20-scene x 100-episode benchmark set.
  SPLIT: "val"
  USE_CKPT_CONFIG: False
  # FeedTTA requires trajectories sampled from pi; its trainer rejects argmax.
  ACTION_SELECTION: "sample"

# Test-time adaptation on the 20 unseen environments (2000 episodes), online
# continual (no per-episode reset). Override TTA.METHOD on the command line:
#   ... TTA.METHOD tent     (Tent)
#   ... TTA.METHOD fstta    (Fast-Slow TTA)
#   ... TTA.METHOD eam      (Elastic auxiliary model + replay)
#   ... TTA.METHOD feedtta  (binary-feedback REINFORCE + SGR)
#   ... TTA.METHOD atena    (active feedback + mixture entropy)
TTA:
  METHOD: "tent"
  EPISODIC: False
  # Tent default. FSTTA launchers explicitly override the fast learning rate.
  LR: 1.0e-6
  STEPS: 1
  # Tent-LN variants: ln (all) | last_k_ln | first_ln | last_ln
  NORM_SCOPE: "last_k_ln"
  LAST_K_LN: 4
  RESET_BN_STATS: True
  OPTIMIZER: "Adam"
  BETA1: 0.9
  BETA2: 0.999
  WEIGHT_DECAY: 0.0
  MAX_GRAD_NORM: 1.0
  UPDATE_INTERVAL: 1
  LOG_INTERVAL_EPISODES: 50
  FSTTA:
    M: 3
    N: 4
    Q: 0.1
    LR_SLOW: 1.0e-4
    RHO: 0.95
    TAU: 0.7
    A: 0.9
    B: 1.1
    USE_SLOW: True
    FAST_GRAD_MODE: "concordant"
    USE_FAST_LR_SCALER: True
    OPTIMIZER: "AdamW"
    BETA1: 0.9
    BETA2: 0.99
    WEIGHT_DECAY: 0.0
    SLOW_OPTIMIZER: "AdamW"
    SLOW_MOMENTUM: 0.0
    RESET_OPTIMIZER_EACH_EPISODE: True
    RESET_VAR_HIST_EACH_EPISODE: False
    RESET_SLOW_OPTIMIZER_EACH_WINDOW: False
    EIGEN_EPS: 1.0e-6
  EAM:
    # Strict Algorithm 3: warm up without updates until |M| reaches batch K.
    LR: 1.0e-5
    CONFIDENCE_SCALE: 0.4
    MEMORY_SIZE: 32
    BATCH_SIZE: 8
    UPDATE_INTERVAL: 1
    PARAM_SCOPE: "module_prefixes"
    TRAINABLE_PREFIXES: ["net.smt_state_encoder.transformer", "action_distribution"]
    OPTIMIZER: "Adam"
    MAX_GRAD_NORM: 0.0
  FEEDTTA:
    LR: 5.0e-6
    P: 0.05
    # REVERIE val-unseen true-SGR anchor; +0.1 is retained for later GS control.
    ALPHA: -0.2
    SGR_SEED: 0
    SGR_MODE: "paper_main"
    GAMMA: 0.99
    NORMALIZE_GRADIENT: False
    PARAM_SCOPE: "module_prefixes"
    TRAINABLE_PREFIXES: ["net.smt_state_encoder", "action_distribution"]
    OPTIMIZER: "Adam"
    EPS: 1.0e-5
    MAX_GRAD_NORM: 0.0
  ATENA:
    # Deliberately blocked; approve only in a reviewed run-specific overlay.
    PREFLIGHT_APPROVED: False
    LR_QUERY: 1.0e-6
    LR_SELF: 1.0e-7
    MIX_LAMBDA: 0.5
    QUERY_THRESHOLD: 0.1
    SELF_LOSS_WEIGHT: 0.1
    PARAM_SCOPE: "all"
    # AVN task-native variant: execute and learn from the sampled action.
    ACTION_SELECTION_PROTOCOL: "sample_from_policy"
    TASK_UPDATE_SCOPE: "replay_reachable_actor_navigation_policy"
    OPTIMIZER: "AdamW"
    WEIGHT_DECAY: 0.01
    MAX_GRAD_NORM: 0.0

RL:
  PPO:
    clip_param: 0.2
    ppo_epoch: 2
    num_mini_batch: 2
    value_loss_coef: 0.5
    entropy_coef: 0.05
    lr: 1.5e-5
    eps: 1e-5
    max_grad_norm: 0.2
    num_steps: 150
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: False
    use_linear_lr_decay: False
    reward_window_size: 50
    use_normalized_advantage: False
    policy_type: "smt"
    use_belief_predictor: False
    use_external_memory: True
    SCENE_MEMORY_TRANSFORMER:
      memory_size: 150
      hidden_size: 256
      nhead: 8
      num_encoder_layers: 1
      num_decoder_layers: 1
      dropout: 0.0
      activation: 'relu'
      use_pretrained: False
      pretrained_path: ''
      freeze_encoders: False
      pretraining: False
    BELIEF_PREDICTOR:
      online_training: False
      train_encoder: False
      lr: 1e-3
      use_label_belief: False
      use_location_belief: False
  DDPPO:
    sync_frac: 0.6
    distrib_backend: "GLOO"
    rnn_type: "GRU"
    num_recurrent_layers: 1
    backbone: "custom_resnet18"
    pretrained_weights: ""
    pretrained: False
    reset_critic: False
