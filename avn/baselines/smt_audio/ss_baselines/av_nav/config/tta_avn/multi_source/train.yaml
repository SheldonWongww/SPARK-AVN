BASE_TASK_CONFIG_PATH: "configs/tta_avn/multi_source/mp3d/semantic_audiogoal.yaml"
TRAINER_NAME: "ddppo"
NUM_PROCESSES: 12
SENSORS: ["DEPTH_SENSOR", "RGB_SENSOR"]
NUM_UPDATES: 30000
LOG_INTERVAL: 10
CHECKPOINT_INTERVAL: 100
VIDEO_OPTION: []
VISUALIZATION_OPTION: []

RL:
  PPO:
    clip_param: 0.2
    ppo_epoch: 2
    num_mini_batch: 2
    value_loss_coef: 0.5
    entropy_coef: 0.05
    lr: 7.5e-6
    eps: 1e-5
    max_grad_norm: 0.2
    num_steps: 150
    hidden_size: 512
    use_gae: True
    gamma: 0.99
    tau: 0.95
    use_linear_clip_decay: False
    use_linear_lr_decay: False
    reward_window_size: 50
    use_normalized_advantage: False
  DDPPO:
    sync_frac: 0.6
    distrib_backend: "GLOO"
    rnn_type: "GRU"
    num_recurrent_layers: 1
    backbone: "custom_resnet18"
    reset_critic: True
