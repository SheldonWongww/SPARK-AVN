ENVIRONMENT:
  MAX_EPISODE_STEPS: 500
  ITERATOR_OPTIONS:
    CYCLE: True
    SHUFFLE: False
    GROUP_BY_SCENE: False
    NUM_EPISODE_SAMPLE: -1
    MAX_SCENE_REPEAT_EPISODES: -1
    MAX_SCENE_REPEAT_STEPS: -1
SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128

  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    EVERLASTING: False
    RIR_SAMPLING_RATE: 16000
    SOURCE_SOUND_DIR: "data/sounds/sound_event_splits/sound_event"
    DISTRACTOR_SOUND_DIR: "data/sounds/sound_event_splits/sound_event"
    HAS_DISTRACTOR_SOUND: True

TASK:
  TYPE: TTAAudioNav
  SUCCESS_DISTANCE: 1.0

  SENSORS: ['SPECTROGRAM_SENSOR']
  GOAL_SENSOR_UUID: spectrogram

  MEASUREMENTS: ['DISTANCE_TO_GOAL', 'NORMALIZED_DISTANCE_TO_GOAL', 'SUCCESS', 'SPL', 'SOFT_SPL', 'NUM_ACTION', 'SUCCESS_WEIGHTED_BY_NUM_ACTION', 'SUCCESS_WHEN_SILENT']
  SUCCESS:
    SUCCESS_DISTANCE: 1.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: True
  DISTANCE_TO_GOAL:
    DISTANCE_TO: VIEW_POINTS

DATASET:
  TYPE: "TTAAudioNav"
  SPLIT: "val"
  CONTENT_SCENES: ["*"]
  VERSION: 'v1'
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/tta_test/multi_source/mp3d/{version}/{split}/{split}.json.gz"
  # Same fixed 20 x 100 stream used by the Tent hyperparameter grids.
  TTA_EPISODES_PER_SCENE: 100
  TTA_EXPECTED_SCENES: 20
  TTA_EPISODE_SEED: 0
  TTA_GLOBAL_SHUFFLE: True
